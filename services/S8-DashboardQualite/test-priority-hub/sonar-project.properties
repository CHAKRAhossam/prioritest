sonar.projectKey=prioritest-s8-dashboard
sonar.projectName=S8-DashboardQualite
sonar.projectVersion=1.0.0
sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.tsx,**/*.test.ts,**/test/**,**/*.config.*,**/*.css
sonar.test.exclusions=**/node_modules/**,**/test/**,**/*.css
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Quality Gate and Profile
sonar.qualitygate.wait=true
sonar.typescript.codeSmellThreshold=100
sonar.typescript.bugThreshold=10
sonar.typescript.vulnerabilityThreshold=0
sonar.typescript.duplicationThreshold=5
sonar.typescript.coverageThreshold=30

