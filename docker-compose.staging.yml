      - "8007:8007"
    environment:
      - ENVIRONMENT=staging
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  s8-dashboard-qualite:
    image: ${DOCKER_REGISTRY}/s8-dashboardqualite:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:8080"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  integrations:
    image: ${DOCKER_REGISTRY}/s9-integrations:${IMAGE_TAG:-latest}
    restart: unless-stopped
